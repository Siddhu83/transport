version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: transport_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: transport_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: transport_admin
      POSTGRES_PASSWORD: transport_pass
      POSTGRES_DB: transport_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport_admin -d transport_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
