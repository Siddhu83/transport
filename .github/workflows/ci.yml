name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Backend Build & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./BACKEND

    env:
      NODE_ENV: test
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://transport_admin:transport_pass@localhost:5432/transport_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: super-secret-jwt-key-replace-in-production-32-chars-min

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './BACKEND/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check & Build
        run: npm run build
